const home=()=>{const e=heroEvent();return `<div class="container"><div class="intro"><div class="intro-row"><span class="intro-kicker"><span class="dot-live"></span> Bengaluru's free tech scene, all in one place</span><span class="intro-note">Independently verified · Organiser-first links</span></div><div class="hero"><div class="hero-copy"><span class="spark">${svg('spark',14)} Find your people. Find your next thing.</span><h1>Your city.<br/>Your next <em>big opportunity.</em></h1><p>Discover the best free tech meetups, AI sessions and hackathons around Bengaluru — beautiful experiences, verified details, zero entry fees.</p><div class="hero-btns"><button class="secondary-btn" data-nav="explore">Explore events ${svg('arrow',17)}</button><button class="outline-btn" style="background:#ffffff18;color:white;border-color:#74669c" data-nav="hackathons">Find hackathons ${svg('bolt',15)}</button></div></div><div class="hero-image"><div class="hero-fallback"></div>${e.thumbnail_url?`<img src="${esc(safeLink(e.thumbnail_url))}" alt="${esc(e.thumbnail_alt||e.name)}" onerror="this.style.display='none'"/>`:''}<span class="floating-pill"><b>●</b> ${events.length} free events live</span><div class="hero-overlay"><span class="mini">✦ Spotlight event · Free admission</span><h3>${esc(e.name)}</h3><p>${svg('calendar',13)} ${dateShort(e.start_at)} &nbsp; · &nbsp; ${svg('pin',13)} ${esc(e.area)}</p></div></div></div>${searchBox()}<div class="trustbar"><span>${svg('shield',16)} Independent event verification</span><span>${svg('check',16)} ₹0 admission only</span><span>${svg('external',15)} Direct organiser registration</span></div></div><section class="section" id="categories"><div class="section-heading"><div><div class="eyebrow">Explore your interests</div><h2>Whatever you're into, <span class="emphasis">it's here.</span></h2></div></div>${catGrid()}</section><section class="section" id="events"><div class="section-heading"><div><div class="eyebrow">The Bengaluru edit</div><h2>Don't miss what's <span class="emphasis">coming up.</span></h2><p>Handpicked from verified organiser listings. Updated with the live directory.</p></div><button class="link" data-nav="explore">Explore all events ${svg('arrow',16)}</button></div>${tabRow()}${quickDates()}<div class="toolbar"><span class="toolbar-left"><b>${filtered().length}</b> free events to discover</span>${selectSort()}</div>${cardGrid(filtered().slice(0,8))}</section><div class="promo"><div><div class="eyebrow" style="color:#cdb9ff">Built for builders</div><h2>Have a hackathon on your radar?</h2><p>Help the community discover more genuine, free events across Bengaluru.</p></div><a href="${PRODUCTION}/suggest" target="_blank" rel="noopener noreferrer" class="secondary-btn">Suggest a free event ${svg('arrow',17)}</a></div></div>`};
const explore=(hack=false)=>{if(hack)state.category='Hackathons';return `<div class="container"><div class="page-head"><div class="eyebrow">Discover the city's best</div><h1>${hack?'Hackathons in Bengaluru':'Explore free tech events'}<span class="emphasis">.</span></h1><p>${hack?'Build cool things, meet other creators and compete — only genuinely free in-person hackathons.':'Find your next opportunity. Filter by interest, venue and benefits in a few taps.'}</p></div><div class="explore-search">${searchBox()}</div><div class="explore-layout"><aside class="filters"><h3>${svg('filter',16)} Filter events</h3><div class="filter"><label for="f-cat">Category</label><select id="f-cat" data-filter="category"><option value="All events">All events</option>${categories.slice(1).map(x=>`<option ${state.category===x[0]?'selected':''}>${esc(x[0])}</option>`).join('')}</select></div><div class="filter"><label for="f-date">When</label><select id="f-date" data-filter="date"><option value="all">Any upcoming date</option><option value="today" ${state.date==='today'?'selected':''}>Today</option><option value="tomorrow" ${state.date==='tomorrow'?'selected':''}>Tomorrow</option><option value="week" ${state.date==='week'?'selected':''}>Next 7 days</option><option value="weekend" ${state.date==='weekend'?'selected':''}>This weekend</option><option value="month" ${state.date==='month'?'selected':''}>This month</option></select></div><div class="filter"><label for="f-area">Location</label><select id="f-area" data-filter="area"><option>All Bengaluru</option>${[...new Set(events.map(x=>x.area))].filter(Boolean).sort().map(x=>`<option ${state.area===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="filter"><label class="check"><input type="checkbox" data-filter="perks" ${state.perks?'checked':''}/> Confirmed goodies or certificates</label></div><button class="link" data-reset="1">Clear all filters ${svg('close',13)}</button></aside><section><div class="result-header"><h3>${filtered().length} events found</h3>${selectSort()}</div>${cardGrid(filtered())}</section></div></div>`};
const savedPage=()=>`<div class="container"><div class="page-head"><div class="eyebrow">Your personal shortlist</div><h1>Saved events<span class="emphasis">.</span></h1><p>Everything you bookmarked in one place, stored privately on this device.</p></div>${saved().length?cardGrid(filtered()):`<div class="saved-empty"><div style="font-size:50px;color:#e65f93">♡</div><h2>Nothing saved just yet</h2><p class="muted">Tap the heart on any event card to keep it here.</p><button class="primary-btn" data-nav="explore">Explore events ${svg('arrow',15)}</button></div>`}</div>`;
const details=()=>{const e=state.selected;if(!e)return explore();const reg=safeLink(e.registration_url),closed=e.registration_status==='closed';const perks=[['🎁','Goodies',e.goodies_status],['🎓','Certificate',e.certificate_status],['🍴','Food',e.food_status]];return `<div class="container"><div class="page-head" style="padding-bottom:0"><a href="?view=explore" data-nav="explore" class="back">← Back to events</a></div><div class="event-layout"><div><div class="detail-hero" style="background:${art(e)}"><div class="thumb-art" style="background:${art(e)}">${cat(e)==='Hackathons'?'H/':cat(e)==='AI & ML'?'AI':'D/'}</div>${e.thumbnail_url?`<img alt="${esc(e.thumbnail_alt||e.name)}" src="${esc(safeLink(e.thumbnail_url))}" onerror="this.style.display='none'"/>`:''}<span class="watermark">ORBIT BLR · ₹0 EVENT</span></div><div class="detail-category">${esc(cat(e))} · 100% Free</div><h1 class="detail-title">${esc(e.name)}</h1><div class="details-info"><span>${svg('verified',15)} Verified source record</span><span>•</span><span>Organised by ${esc(e.organizer)}</span></div><div class="info-block"><h2>About this event</h2><p>${esc(e.description||'Join this in-person tech event in Bengaluru. Please review the official organiser page for the latest agenda and eligibility details.')}</p><p>Registration happens directly on the organiser's website. An open application or RSVP does not guarantee entry unless the organiser confirms your acceptance.</p></div><div class="info-block"><h2>What is included?</h2><div class="benefits">${perks.map(([icon,label,stat])=>`<div class="benefit"><div style="font-size:24px;margin-bottom:6px">${icon}</div><b>${label}</b><span>${esc(stat==='confirmed'?'Confirmed by organiser':stat==='conditional'?'Conditional / eligibility based':'Not independently confirmed')}</span></div>`).join('')}</div></div><div class="info-block"><h2>Event verification</h2><p>ORBIT BLR lists only independently vetted, free, in-person Bengaluru events. Organiser pages can change — check admission and venue information again before travelling.</p><p class="proof">Official listing: <a href="${reg}" target="_blank" rel="noopener noreferrer">${esc(e.registration_url)} ${svg('external',12)}</a></p></div></div><aside class="booking"><span class="pill free">✓ Verified free event</span><div style="margin-top:15px"><span class="price">₹0 <small>/ entry</small></span></div><p class="muted" style="font-size:12px;margin:0">No standard ticket fee. Registration rules may apply.</p><div class="line"></div><div class="booking-row"><div class="ic">${svg('calendar',19)}</div><div><b>${dateLong(e.start_at)}</b><span>${time(e.start_at)} – ${time(e.end_at||e.start_at)} IST${startDay(e.start_at)!==startDay(e.end_at||e.start_at)?' · Ends next day':''}</span></div></div><div class="booking-row"><div class="ic">${svg('pin',19)}</div><div><b>${esc(e.venue)}</b><span>${esc(e.area)}, Bengaluru</span></div></div><div class="booking-row"><div class="ic">${svg('users',19)}</div><div><b>${esc(statusText(e))}</b><span>Official organiser controls admission</span></div></div>${closed?`<button class="primary-btn" disabled>Registration currently closed</button>`:`<a class="primary-btn" href="${reg}" target="_blank" rel="noopener noreferrer">${esc(statusCTA(e))} ${svg('external',15)}</a>`}<button class="outline-btn" style="width:100%;margin-top:9px" data-save="${esc(e.id)}">${svg('heart',16)} ${isSaved(e.id)?'Remove from saved':'Save this event'}</button><button class="link" style="margin:15px auto 0;display:flex" data-share="${esc(e.slug)}">${svg('share',15)} Copy event link</button><p class="fine">You'll be redirected to the verified organiser page for registration. ORBIT BLR does not issue tickets.</p></aside></div></div>`};
const loadViewFromURL=()=>{const u=new URL(location.href);let slug=u.searchParams.get('event');if(slug){state.selected=events.find(e=>e.slug===slug)||null;state.page=state.selected?'event':'explore'}else{let v=u.searchParams.get('view');state.page=['explore','hackathons','saved'].includes(v)?v:'home';state.selected=null}if(state.page==='hackathons')state.category='Hackathons'};
const render=()=>{document.title=(state.page==='event'&&state.selected?`${state.selected.name} | `:'')+'ORBIT BLR — Free tech events in Bengaluru';let body=state.page==='event'?details():state.page==='explore'?explore():state.page==='hackathons'?explore(true):state.page==='saved'?savedPage():home();document.querySelector('#app').innerHTML=head()+`<main id="main">${body}</main>`+footer()+bottom();bind()};
const bind=()=>{document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();const p=el.dataset.nav;if(p==='hackathons'){state.category='Hackathons';nav('hackathons')}else nav(p)}));document.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click',()=>{state.date=el.dataset.date;render();if(state.page==='home')document.getElementById('events')?.scrollIntoView({behavior:'smooth',block:'start'})}));document.querySelectorAll('[data-category]').forEach(el=>el.addEventListener('click',()=>{state.category=el.dataset.category;if(state.page!=='home')state.page=state.page==='hackathons'?'hackathons':'explore';render();if(state.page==='home')document.getElementById('events')?.scrollIntoView({behavior:'smooth',block:'start'})}));document.querySelectorAll('[data-event]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openEvent(el.dataset.event)}));document.querySelectorAll('[data-save]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setSaved(el.dataset.save)}));document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('change',()=>{state[el.dataset.filter]=el.type==='checkbox'?el.checked:el.value;render()}));document.querySelectorAll('[data-reset]').forEach(el=>el.addEventListener('click',()=>{Object.assign(state,{category:'All events',query:'',area:'All Bengaluru',date:'all',sort:'soon',perks:false});render()}));document.querySelectorAll('#search-form').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(form);state.query=String(fd.get('q')||'');state.area=String(fd.get('area')||'All Bengaluru');nav('explore')}));document.querySelectorAll('[data-share]').forEach(el=>el.addEventListener('click',async()=>{const link=`${PRODUCTION}/events/${encodeURIComponent(el.dataset.share)}`;try{await navigator.clipboard.writeText(link);toast('Official ORBIT BLR event link copied')}catch{toast(link)}}));};
const toast=s=>{document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=s;document.body.appendChild(el);setTimeout(()=>el.remove(),3200)};
window.addEventListener('popstate',()=>{loadViewFromURL();render()});
async function loadLive(){try{const abort=new AbortController();let t=setTimeout(()=>abort.abort(),3800);const candidates=[location.origin+'/api/events',PRODUCTION+'/api/events'];for(const u of candidates){try{let r=await fetch(u,{signal:abort.signal,cache:'no-store'});if(!r.ok)continue;const j=await r.json();if(j.success&&Array.isArray(j.events)){events=j.events.filter(e=>e.publication_status==='published'&&e.is_free===true&&e.is_in_person!==false).map(e=>({...e,thumbnail_url:e.thumbnail_url||null}));state.snapshot=false;clearTimeout(t);loadViewFromURL();render();return}}catch(_){/* static/offline fallback; never invent live status */}}clearTimeout(t)}catch(_){/* static snapshot only */}}
loadViewFromURL();render();if(!new URL(location.href).searchParams.has("offline"))loadLive();

</script>
</body>
</html>
