name: Normalize lockfile on hardening branch

on:
  push:
    branches: [hardening/automation-20261021]
    paths:
      - '.github/workflows/normalize-lockfile.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  normalize:
    if: github.repository == 'tejas-ai/orbit-blr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lockfile with npm (no application execution)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only normalized lockfile to feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "orbit-blr-quality-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: normalize dependency lockfile via npm"
            git push origin HEAD:hardening/automation-20261021
          else
            echo "Lockfile already normalized"
          fi
