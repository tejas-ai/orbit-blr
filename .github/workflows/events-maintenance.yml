name: ORBIT BLR Hourly Maintenance & Ingestion Scheduler

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ORBIT BLR Hourly Maintenance & Archival
        run: |
          echo "Triggering ORBIT BLR maintenance endpoint..."
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST "https://orbit-blr.vercel.app/api/cron/events-maintenance" \
            -H "Authorization: Bearer ${{ secrets.ORBIT_API_SECRET }}" \
            -H "Content-Type: application/json")
          
          echo "$RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/^HTTP_STATUS://p')
          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Maintenance cron failed with HTTP status $STATUS"
            exit 1
          fi
